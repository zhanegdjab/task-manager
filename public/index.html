<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>智能任务管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">✓</span>
        <div class="brand-text">
          <h1>智能任务管理</h1>
          <p class="subtitle">按优先级理清今天要做的事</p>
        </div>
      </div>
      <span class="storage-chip" id="storage-chip" hidden></span>
    </header>

    <section class="card add-card" aria-labelledby="add-heading">
      <h2 class="sr-only" id="add-heading">添加任务</h2>
      <form id="add-form" class="add-form" autocomplete="off">
        <label class="sr-only" for="title">任务标题</label>
        <input
          id="title"
          name="title"
          class="input"
          type="text"
          maxlength="200"
          placeholder="今天要做什么？输入后按回车添加"
        />
        <label class="sr-only" for="priority">优先级</label>
        <div class="select-wrap">
          <select id="priority" name="priority" class="select">
            <option value="高">高优先级</option>
            <option value="中" selected>中优先级</option>
            <option value="低">低优先级</option>
          </select>
        </div>
        <button type="submit" class="btn primary" id="add-btn">添加任务</button>
      </form>
      <p class="form-hint" id="form-hint" role="status"></p>
    </section>

    <section class="toolbar" aria-label="筛选与统计">
      <div class="filters" id="filters">
        <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">
          全部<span class="count" data-count="all">0</span>
        </button>
        <button type="button" class="filter" data-filter="高" aria-pressed="false">
          <i class="dot dot-high" aria-hidden="true"></i>高<span class="count" data-count="高">0</span>
        </button>
        <button type="button" class="filter" data-filter="中" aria-pressed="false">
          <i class="dot dot-medium" aria-hidden="true"></i>中<span class="count" data-count="中">0</span>
        </button>
        <button type="button" class="filter" data-filter="低" aria-pressed="false">
          <i class="dot dot-low" aria-hidden="true"></i>低<span class="count" data-count="低">0</span>
        </button>
      </div>
      <p class="progress" id="progress">加载中…</p>
    </section>

    <div class="progress-bar" aria-hidden="true">
      <span class="progress-fill" id="progress-fill" style="width:0%"></span>
    </div>

    <div class="alert" id="alert" hidden role="alert"></div>

    <ul class="task-list" id="task-list"></ul>

    <div class="empty" id="empty" hidden>
      <span class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3.5" width="16" height="17" rx="3" />
          <path d="M8 9h8M8 13h8M8 17h4" />
        </svg>
      </span>
      <p class="empty-title" id="empty-title">还没有任务</p>
      <p class="empty-text" id="empty-text">在上面输入框里写下第一件要做的事吧</p>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
